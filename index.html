<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PPL Log">
<meta name="theme-color" content="#e9ecff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>PPL Log</title>
<style>
@font-face{font-family:'Archivo Black';src:url(fonts/archivo-black-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(fonts/ibm-plex-mono-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url(fonts/ibm-plex-mono-700.woff2) format('woff2');font-weight:700;font-display:swap}
:root{
  --bg:#e9ecff;--card:#fff;--ink:#000;--muted:#4b4b5c;--pink:#ff4fa3;--blue:#2f5bff;--yellow:#ffe14d;--soft:#f3f4ff;
  --line:3px solid #000;--sh:4px 4px 0 #000;--r:10px;--r2:7px;
  --display:'Archivo Black','Arial Black',Impact,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --push:var(--pink);--pull:var(--blue);--leg:var(--yellow);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{margin:0;color:var(--ink);font:15px/1.4 var(--mono)}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 100px);min-height:100vh;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow-x:hidden;
  background-image:radial-gradient(rgba(0,0,0,.13) 1px,transparent 1.3px);background-size:22px 22px}
button{font:700 15px/1.2 var(--mono);color:var(--ink);background:var(--card);border:var(--line);border-radius:var(--r2);box-shadow:var(--sh);padding:12px 14px;cursor:pointer;transition:transform .07s,box-shadow .07s}
button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
button:disabled{opacity:.35;box-shadow:none}
button.pk{background:var(--pink)}
button.bl{background:var(--blue);color:#fff}
button.ye{background:var(--yellow)}
button.big{width:100%;font:400 19px/1.1 var(--display);text-transform:uppercase;padding:16px;letter-spacing:.02em}
button.ghost{background:none;border:0;box-shadow:none;padding:8px 2px;text-decoration:underline;font-weight:400}
button.ghost:active{transform:none}
button.danger{background:#fff;color:#d10045}
h1{font:400 30px/1.02 var(--display);text-transform:uppercase;margin:10px 0 6px;letter-spacing:-.01em;overflow-wrap:anywhere}
h2{font:400 18px/1.1 var(--display);text-transform:uppercase;margin:22px 0 10px}
.small{font-size:12px}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;min-height:20px}
.card{background:var(--card);border:var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.sticker{display:inline-block;font:700 11px/1 var(--mono);text-transform:uppercase;padding:5px 7px;border:2.5px solid #000;border-radius:5px;background:var(--yellow);transform:rotate(-4deg);box-shadow:2px 2px 0 #000;white-space:nowrap}
.bar{height:16px;border:var(--line);border-radius:6px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--pink) 0 8px,#ff7dbd 8px 16px);border-right:3px solid #000;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
textarea,select,input[type=text]{width:100%;font:15px var(--mono);color:#000;background:#fff;border:var(--line);border-radius:var(--r2);padding:12px;box-shadow:var(--sh);-webkit-user-select:text;user-select:text;outline:0}
textarea:focus,select:focus,input[type=text]:focus{background:#fffbe0}
textarea{min-height:70px;resize:vertical}
label.lb{display:block;font:400 13px var(--display);text-transform:uppercase;margin:18px 0 8px}

/* HUD: level + XP */
.hud{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;text-align:left}
.lv{font:400 15px/1 var(--display);background:var(--yellow);border:2.5px solid #000;border-radius:5px;padding:6px 7px;white-space:nowrap}
.hud .bar{flex:1;height:14px}
.hud small{font-size:11px;white-space:nowrap}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0 8px}
.day{border:2.5px solid #000;border-radius:7px;background:#fff;text-align:center;padding:5px 0 4px;font-size:11px;line-height:1.15;min-width:0}
.day b{display:block;font:400 15px/1.1 var(--display)}
.day.today{box-shadow:3px 3px 0 #000;outline:3px solid var(--pink);outline-offset:1px}
.day.push{background:var(--pink)}.day.pull{background:var(--blue);color:#fff}.day.leg{background:var(--yellow)}
.day.future{opacity:.45}

/* workout type rows */
.type{display:flex;align-items:center;gap:12px;width:100%;margin:12px 0;padding:12px;text-align:left;position:relative}
.type .tic{flex:none;width:52px;height:52px;border:var(--line);border-radius:8px;display:grid;place-items:center;background:var(--tc)}
.type .tic svg{width:28px;height:28px;stroke:#000;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.type.pull .tic svg{stroke:#fff}
.type b{display:block;font:400 25px/1 var(--display);text-transform:uppercase}
.type .sub{font-size:12px;color:var(--muted);font-weight:400}
.type .when{font-size:11px;font-weight:400}
.type.next{background:var(--tc)}
.type.next.pull{color:#fff}.type.next.pull .sub{color:#dfe5ff}
.type.next .tic{background:#fff}.type.next.pull .tic svg{stroke:#000}
.type .sticker{position:absolute;right:8px;top:-12px}

/* tiles (exercise grid) */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{display:flex;flex-direction:column;padding:0;overflow:hidden;text-align:left;position:relative}
.tile svg{display:block;width:100%;height:auto;aspect-ratio:100/91;background:var(--soft);border-bottom:var(--line)}
.tile .tx{padding:8px 9px 10px;display:grid;gap:3px}
.tile .nm{font:700 13px/1.2 var(--mono)}
.tile .ls{font-size:11px;font-weight:400;color:var(--muted)}
.tile.done{background:var(--yellow)}
.tile.done svg{background:#fff3a6}
.tile .sticker{position:absolute;top:8px;right:8px;background:#fff}
.tile.done .sticker{background:var(--pink)}
.ttl{display:inline-block;background:var(--tc);border:var(--line);box-shadow:var(--sh);border-radius:8px;padding:6px 12px 4px;margin:6px 0 10px;font:400 34px/1 var(--display)}
.ttl.pull{color:#fff}

/* figures */
svg.fig .floor{stroke:#000;stroke-width:1.5;opacity:.35}
svg.fig .prop{stroke:#000;stroke-width:2.2;fill:none}
svg.fig .prop rect{fill:#c9cdea}
svg.fig path,svg.fig line.torso{stroke:#000;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
svg.fig .back{opacity:.35}
svg.fig circle.head{fill:#000}
svg.fig .db{fill:var(--pink);stroke:#000;stroke-width:2.2}

/* log one set */
.hero{padding:0;overflow:hidden}
.hero svg{display:block;width:100%;height:150px;background:var(--soft)}
.setchips{display:flex;gap:8px;margin:12px 0}
.setchips button{flex:1;padding:10px 0;font:400 16px var(--display)}
.setchips button.cur{background:var(--yellow);outline:3px solid var(--pink);outline-offset:2px}
.setchips button.done{background:#000;color:#fff}
.setchips button.add{flex:.7;background:var(--soft)}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nums.one{grid-template-columns:1fr}
.num{display:grid;grid-template-rows:auto 1fr auto;gap:6px;padding:8px;text-align:center}
.num .pm{font:400 26px/1 var(--display);padding:8px 0;box-shadow:3px 3px 0 #000}
.num .val{font:400 66px/1 var(--display);padding:6px 0 0;touch-action:none;cursor:ns-resize;font-variant-numeric:tabular-nums}
.num .unit{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-top:-2px}
.num .val.bump{animation:bump .18s}
@keyframes bump{50%{transform:scale(1.12)}}
.setlabel{font:400 14px var(--display);text-transform:uppercase;text-align:center;margin:4px 0 0}
details.cue{margin-top:14px}
details.cue summary{font:400 13px var(--display);text-transform:uppercase;list-style:none;cursor:pointer}
details.cue summary::-webkit-details-marker{display:none}
details.cue p{margin:8px 0 0;font-size:13px;line-height:1.5}
.xpf{position:fixed;z-index:30;font:400 22px var(--display);color:#000;background:var(--yellow);border:2.5px solid #000;border-radius:6px;padding:3px 8px;box-shadow:3px 3px 0 #000;pointer-events:none;animation:xpf 1.1s ease-out forwards}
@keyframes xpf{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}

/* full-screen rest timer */
#rest{position:fixed;inset:0;z-index:20;display:none;background:var(--blue);color:#fff;
  background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1.3px);background-size:22px 22px;
  padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 24px)}
#rest.show{display:flex;animation:slidein .28s cubic-bezier(.3,1.3,.5,1)}
@keyframes slidein{from{transform:translateY(40px);opacity:0}}
.rin{margin:auto;width:100%;max-width:380px;display:grid;gap:18px;justify-items:center}
.rin .lbl{font:400 26px var(--display);letter-spacing:.06em}
.ring{--p:1;width:230px;height:230px;border-radius:50%;border:var(--line);box-shadow:6px 6px 0 #000;display:grid;place-items:center;background:conic-gradient(var(--yellow) calc(var(--p) * 360deg),#000 0)}
.ring>div{width:176px;height:176px;border-radius:50%;background:#fff;color:#000;border:var(--line);display:grid;place-content:center;text-align:center}
.ring b{font:400 58px/1 var(--display);font-variant-numeric:tabular-nums}
.ring small{font-size:12px;color:var(--muted)}
.rin .row{width:100%}
.rin .row button{flex:1;font:400 20px var(--display)}
.rin .card{width:100%;color:#000}
.rin .card small{display:block;font:700 11px var(--mono);letter-spacing:.12em;color:var(--muted)}
.rin .card b{font:400 17px/1.15 var(--display);text-transform:uppercase}

/* finish screen */
.delta{text-align:center;padding:16px 12px}
.delta b{display:block;font:400 54px/1 var(--display)}
.delta.up{background:var(--pink)}
.delta.down{background:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stats .card{text-align:center;padding:10px 4px}
.stats b{display:block;font:400 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stats small{font-size:11px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:1fr auto auto 26px;gap:8px 10px;align-items:center;font-size:13px}
.cmp .h{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.cmp .n{font-variant-numeric:tabular-nums;text-align:right}
.cmp .a{font:400 16px var(--display);text-align:center;border:2px solid #000;border-radius:4px;line-height:20px}
.cmp .a.up{background:var(--pink)}.cmp .a.eq{background:#fff}.cmp .a.dn{background:var(--soft)}
.cmp>.sep{grid-column:1/-1;border-top:2px dashed #000;height:0}
.xpcard{background:var(--yellow)}
.xpcard .big{font:400 34px/1 var(--display)}

/* reward modal */
#reward{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:20px}
#reward.show{display:flex}
.rcard{width:100%;max-width:360px;background:var(--yellow);border:var(--line);border-radius:12px;box-shadow:8px 8px 0 #000;padding:18px;position:relative;animation:rpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes rpop{from{transform:scale(.5) rotate(-12deg);opacity:0}to{transform:rotate(-1.5deg)}}
.rcard{transform:rotate(-1.5deg)}
.rcard h3{font:400 28px/1 var(--display);margin:0 0 6px}
.rcard .why{display:inline-block;background:#000;color:#fff;font-weight:700;font-size:12px;padding:5px 8px;border-radius:4px}
.rcard .fact{background:#fff;border:var(--line);border-radius:8px;padding:12px;margin:14px 0;font-size:14px;line-height:1.5}
.rcard .fact small{display:block;font:400 12px var(--display);color:var(--pink);margin-bottom:4px;letter-spacing:.04em}
.rcard .cf{position:absolute;width:12px;height:12px;border:2px solid #000;animation:cf .9s ease-out forwards}
@keyframes cf{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}

/* history calendar */
.calhd{display:flex;align-items:center;gap:10px}
.calhd b{flex:1;text-align:center;font:400 20px var(--display);text-transform:uppercase}
.calhd button{padding:8px 14px;font:400 18px var(--display)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:12px 0}
.cal .wd{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.cal button{padding:5px 0 4px;min-height:46px;font:700 13px var(--mono);box-shadow:2px 2px 0 #000;display:flex;flex-direction:column;align-items:center;gap:3px;border-width:2.5px;border-radius:6px}
.cal button.out{visibility:hidden}
.cal button.sel{background:var(--yellow);outline:3px solid var(--pink);outline-offset:1px}
.cal button.today{text-decoration:underline 3px}
.cal .dots{display:flex;gap:2px}
.cal .dots i{width:8px;height:8px;border:1.5px solid #000;border-radius:2px}
i.push{background:var(--pink)}i.pull{background:var(--blue)}i.leg{background:var(--yellow)}
.sess{margin:12px 0}
.chip{display:inline-block;font:400 12px/1 var(--display);padding:5px 7px;border:2.5px solid #000;border-radius:5px;background:var(--tc);text-transform:uppercase}
.chip.pull{color:#fff}

/* progress */
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 0;font:400 13px var(--display);box-shadow:2px 2px 0 #000}
.seg button.on{background:#000;color:#fff}
.chart{display:block;width:100%;height:auto}
.chart .gl{stroke:#000;stroke-width:1;stroke-dasharray:3 4;opacity:.3}
.chart .ar{fill:var(--pink);opacity:.35}
.chart .ln{fill:none;stroke:#000;stroke-width:3.5;stroke-linejoin:round}
.chart .pt{fill:var(--yellow);stroke:#000;stroke-width:2.5}
.chart text{font:700 11px var(--mono);fill:#000}
.chips{display:flex;gap:8px;margin:12px 0}
.chips button{flex:1;padding:9px 0;font:700 13px var(--mono);box-shadow:2px 2px 0 #000}
.chips button.on{background:var(--pink)}

/* settings */
.group{padding:0;overflow:hidden;margin:10px 0}
.group button{display:flex;align-items:center;width:100%;border:0;border-bottom:2.5px solid #000;border-radius:0;box-shadow:none;text-align:left;padding:14px 12px;gap:10px;font-weight:700}
.group button:last-child{border-bottom:0}
.group button:active{transform:none;background:var(--yellow)}
.group button .v{margin-left:auto;font-weight:400;color:var(--muted)}
.grouplbl{font:700 11px var(--mono);letter-spacing:.12em;color:var(--muted);margin:20px 2px 0;text-transform:uppercase}
.list-edit .row{margin:8px 0;padding:8px 10px}
.list-edit button{padding:7px 10px;box-shadow:2px 2px 0 #000}

/* badges + facts */
.lvbig{display:flex;align-items:center;gap:14px}
.lvbig .n{font:400 52px/1 var(--display);background:var(--yellow);border:var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--sh)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{padding:10px 6px;text-align:center;display:grid;gap:4px;justify-items:center}
.badge .ic{width:40px;height:40px;border:2.5px solid #000;border-radius:50%;display:grid;place-items:center;font:400 18px var(--display);background:var(--pink)}
.badge b{font:700 11px/1.2 var(--mono)}
.badge small{font-size:10px;color:var(--muted);line-height:1.25}
.badge.lock{background:transparent;border-style:dashed;box-shadow:none}
.badge.lock .ic{background:#fff;border-style:dashed}
.factlist .card{margin:10px 0;font-size:13px;line-height:1.5}
.factlist small{display:block;font:400 12px var(--display);color:var(--pink)}

/* nav, back, banner, toast */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:#fff;border-top:var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);transition:transform .25s}
nav.hide{transform:translateY(110%)}
nav button{flex:1;border:0;box-shadow:none;background:none;padding:6px 0 5px;font:700 10px var(--mono);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:6px}
nav button:active{transform:none}
nav button svg{width:22px;height:22px;stroke:#000;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:var(--yellow);outline:2.5px solid #000}
#back{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:7;width:46px;height:46px;padding:0;display:none;place-items:center}
#back svg{width:24px;height:24px;stroke:#000;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
body.hasBack,body.hasUpd{padding-top:calc(env(safe-area-inset-top) + 68px)}
body.hasBack #back{display:grid}
#upd{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;z-index:8;display:none;align-items:center;gap:10px;padding:6px 6px 6px 12px;background:var(--yellow);border:var(--line);border-radius:var(--r);box-shadow:var(--sh);font-weight:700;font-size:13px}
body.hasBack #upd{left:70px}
body.hasUpd #upd{display:flex}
#upd span{flex:1}
#upd button{padding:8px 10px;font-size:13px;box-shadow:2px 2px 0 #000}
#toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 12px);z-index:50;background:#000;color:#fff;font-weight:700;border-radius:var(--r);padding:14px;text-align:center;box-shadow:4px 4px 0 var(--pink);display:none}
#toast.show{display:block;animation:slidein .25s}

/* page transitions */
#app.fwd>*{animation:upin .32s cubic-bezier(.3,1.3,.5,1) both;animation-delay:calc(var(--i,0) * 30ms)}
#app.bck>*{animation:lfin .28s ease-out both}
@keyframes upin{from{opacity:0;transform:translateY(14px)}}
@keyframes lfin{from{opacity:0;transform:translateX(-18px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<button id="back" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<div id="upd"><span>Versi baru tersedia</span><button id="updBtn">Muat ulang</button></div>
<div id="app"></div>
<div id="rest"><div class="rin">
  <div class="lbl">ISTIRAHAT</div>
  <div class="ring" id="ring"><div><b id="restT">1:30</b><small>dari <span id="restTot">1:30</span></small></div></div>
  <div class="row"><button id="restMinus">−15</button><button id="restPlus">+15</button></div>
  <div class="card"><small>BERIKUTNYA</small><b id="restNext">Set 2</b></div>
  <button class="ye big" id="restSkip">Lewati istirahat</button>
</div></div>
<div id="reward"></div>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
'use strict';
const KEY = 'ppllog-v1';
const TYPES = {
  push: {name: 'PUSH', sub: 'Dada · Bahu · Trisep', icon: 'M4 12h14M13 6l6 6-6 6'},
  pull: {name: 'PULL', sub: 'Punggung · Bisep', icon: 'M20 12H6M11 6l-6 6 6 6'},
  leg:  {name: 'LEG',  sub: 'Kaki · Bokong', icon: 'M7 20V9M7 9l-3 3M7 9l3 3M17 4v11M17 15l-3-3M17 15l3-3'},
};
const NEXT = {push: 'pull', pull: 'leg', leg: 'push'};
const DEFAULT_PLAN = {
  push: ['pushup', 'floorpress', 'shoulderpress', 'lateral', 'dips', 'ohtri'],
  pull: ['bentrow', 'onerow', 'reardelt', 'superman', 'curl', 'hammer'],
  leg:  ['goblet', 'rdl', 'lunge', 'bss', 'bridge', 'calf'],
};
const REP_MIN = 5, REP_MAX = 20, KG_MIN = 0, KG_MAX = 20, SET_MAX = 4;

/* Animated figure poses. Canvas 100x96, floor at y=88, figure faces right.
   hip:[x,y], t: torso angle (0 = upright, 90 = lying with head right),
   h1/h2: hand targets, f1/f2: foot targets (solved with 2-bone IK),
   ha1/ha2: [upper arm, forearm] absolute angles (0 = down, + = forward).
   eb/kb: elbow/knee bend side (+1 clockwise on screen). db: dumbbells drawn (1 or 2). */
const EX = {

function stats(list) {
  const st = {sessions: list.length, sets: 0, reps: 0, kg: 0, prs: 0, xp: 0, types: {}, best7: 0, early: 0, night: 0};
  const seen = {};
  for (const s of list) {
    st.types[s.type] = (st.types[s.type] || 0) + 1;
    const h = new Date(s.start).getHours(); if (h < 8) st.early++; if (h >= 21) st.night++;
    st.xp += XP_SESSION;
    for (const e of s.entries) {
      const prev = seen[e.ex] || [];
      let pr = false;
      for (const x of e.sets) {
        st.sets++; st.reps += x.reps; st.kg += x.reps * x.kg; st.xp += setXP(x);
        if (prev.length && !prev.some(p => p.kg >= x.kg && p.reps >= x.reps)) pr = true;
      }
      if (pr) { st.prs++; st.xp += XP_PR; }
      seen[e.ex] = prev.concat(e.sets);
    }
  }
  const t = list.map(s => s.start).sort((a, b) => a - b);
  for (let i = 0, j = 0; i < t.length; i++) { while (t[i] - t[j] > 7 * 864e5) j++; st.best7 = Math.max(st.best7, i - j + 1); }
  let L = 1; while (st.xp >= need(L + 1)) L++;
  st.level = L; st.into = st.xp - need(L); st.span = need(L + 1) - need(L);
  st.badges = BADGES.filter(b => b.ok(st)).map(b => b.id);
  return st;
}
function pickFact() {
  const left = FACTS.map((_, i) => i).filter(i => !S.facts.includes(i));
  if (!left.length) return Math.floor(Math.random() * FACTS.length);

  S.facts.push(i); return i;
}

    const s = ex.front ? [sh[0] + 7 * side, sh[1]] : sh;
    const hp = ex.front ? [hip[0] + 4 * side, hip[1]] : hip;
    let el, hand;

      el = [s[0] + 13 * u[0], s[1] + 13 * u[1]]; hand = [el[0] + 12 * f[0], el[1] + 12 * f[1]];
    } else [el, hand] = ik(s, LV(A['h' + k], B['h' + k]), 13, 12, eb[i]);

function numCtl(box, get, set, min, max) {
  const val = box.querySelector('.val');
  const show = () => { val.textContent = get(); val.classList.remove('bump'); void val.offsetWidth; val.classList.add('bump'); };
  const step = d => { const v = clamp(get() + d, min, max); if (v !== get()) { set(v); show(); } };
  box.querySelectorAll('.pm').forEach(b => {
    let t, iv;
    const stop = () => { clearTimeout(t); clearInterval(iv); };
    b.addEventListener('pointerdown', e => { e.preventDefault(); step(+b.dataset.d); t = setTimeout(() => { iv = setInterval(() => step(+b.dataset.d), 90); }, 380); });

function finish() {
  const a = S.active;
  const entries = a.order.filter(id => a.ex[id]).map(id => ({ex: id, name: exName(id), sets: a.ex[id].sets.filter(s => s.done).map(s => ({reps: s.reps, kg: s.kg}))})).filter(e => e.sets.length);
  if (!entries.length) {
    if (confirm('Belum ada set yang selesai. Batalkan sesi ini?')) { S.active = null; S.restEnd = 0; save(); go('home'); }
    return;
  }
  if (!confirm('Selesaikan dan simpan workout ini?')) return;
  const prs = [];
  for (const e of entries) {
    const prevSets = S.sessions.flatMap(s => s.entries.filter(x => x.ex === e.ex).flatMap(x => x.sets));
    if (!prevSets.length) continue;
    const beat = e.sets.filter(s => !prevSets.some(p => p.kg >= s.kg && p.reps >= s.reps));
    if (beat.length) { const b = beat.sort((x, y) => y.kg - x.kg || y.reps - x.reps)[0]; prs.push(e.name + ': ' + (b.kg ? b.kg + ' kg × ' + b.reps : b.reps + ' rep')); }
  }
  const before = stats(S.sessions), prevType = lastOfType(a.type);
  const sess = {id: Date.now(), type: a.type, start: a.start, end: Date.now(), note: a.note.trim(), entries};
  S.sessions.push(sess);
  const after = stats(S.sessions);
  const events = [];
  for (let L = before.level + 1; L <= after.level; L++) events.push({why: 'Naik ke Level ' + L});
  after.badges.filter(b => !before.badges.includes(b)).forEach(b => events.push({why: 'Lencana: ' + BADGES.find(x => x.id === b).name}));
  prs.forEach(p => events.push({why: 'Rekor baru · ' + p}));
  events.forEach(ev => { ev.fact = pickFact(); });
  S.active = null; S.restEnd = 0; save();
  lastResult = {sess, prs, before, after, prevType, events};
  go('done');
  if (events.length) setTimeout(() => showRewards(events.slice()), 450);
}

  const {sess, before, after, prevType, events} = lastResult, sets = sess.entries.flatMap(e => e.sets);
  const v = vol(sets), pv = prevType ? vol(prevType.entries.flatMap(e => e.sets)) : 0;
  const pct = pv ? Math.round((v - pv) / pv * 100) : null;
  let h = `<h1>${TYPES[sess.type].name} vs sesi lalu</h1>`;
  h += pct === null
    ? `<div class="card delta up"><b>SESI PERTAMA!</b><span class="small">Ini sesi ${TYPES[sess.type].name} pertamamu. Jadi patokan berikutnya.</span></div>`
    : `<div class="card delta ${pct >= 0 ? 'up' : 'down'}"><b>${pct > 0 ? '▲' : pct < 0 ? '▼' : '='} ${Math.abs(pct)}%</b><span class="small">total volume (rep × kg) dibanding ${TYPES[sess.type].name} sebelumnya</span></div>`;
  h += `<div class="stats"><div class="card"><b>${fmtDur(sess.end - sess.start)}</b><small>durasi</small></div><div class="card"><b>${sets.length}</b><small>set</small></div><div class="card"><b>${sets.reduce((n, s) => n + s.reps, 0)}</b><small>repetisi</small></div></div>`;
  h += `<div class="card"><div class="cmp"><span class="h">GERAKAN</span><span class="h n">LALU</span><span class="h n">KINI</span><span></span><span class="sep"></span>`;
  for (const e of sess.entries) {
    const p = lastSets(e.ex, sess.start), now = vol(e.sets), was = p ? vol(p) : null;
    const cls = was === null ? 'eq' : now > was ? 'up' : now < was ? 'dn' : 'eq', ar = was === null ? '•' : now > was ? '▲' : now < was ? '▼' : '=';
    h += `<span>${esc(e.name)}</span><span class="n muted">${was === null ? '–' : num(was)}</span><span class="n"><b>${num(now)}</b></span><span class="a ${cls}">${ar}</span>`;
  }
  h += `</div><div class="small muted" style="margin-top:8px">Angka = volume (rep × kg). Gerakan tanpa beban dihitung dari repetisi.</div></div>`;
  h += `<div class="card xpcard" style="margin-top:14px"><div class="row"><span class="big grow">+${num(after.xp - before.xp)} XP</span><span class="lv" style="background:#fff">LV ${after.level}</span></div>
    <div class="bar" style="margin-top:10px"><i style="width:${Math.round(after.into / after.span * 100)}%"></i></div>
    <div class="small" style="margin-top:6px">${num(after.span - after.into)} XP lagi ke level ${after.level + 1}</div></div>`;
  if (events.length) h += `<button class="big ye" style="margin-top:14px" id="again">Buka lagi ${events.length} hadiah</button>`;
  h += `<button class="big pk" style="margin-top:14px" id="ok">Selesai</button>`;
  app.innerHTML = h;
  document.getElementById('ok').onclick = () => go('home');
  const ag = document.getElementById('again'); if (ag) ag.onclick = () => showRewards(events.slice());
}

function history() {
  const now = new Date();
  if (histY === null) { const l = S.sessions[S.sessions.length - 1]; const d = l ? new Date(l.start) : now; histY = d.getFullYear(); histM = d.getMonth(); histSel = l ? ymd(l.start) : ymd(now); }
  const first = new Date(histY, histM, 1), days = new Date(histY, histM + 1, 0).getDate(), lead = (first.getDay() + 6) % 7;
  const byDay = {}; S.sessions.forEach(s => { (byDay[ymd(s.start)] = byDay[ymd(s.start)] || []).push(s); });
  let cells = 'SSRKJSM'.split('').map(d => `<span class="wd">${d}</span>`).join('');
  for (let i = 0; i < lead; i++) cells += '<button class="out" tabindex="-1"></button>';
  for (let d = 1; d <= days; d++) {
    const k = histY + '-' + histM + '-' + d, ss = byDay[k] || [];
    cells += `<button data-k="${k}" class="${k === histSel ? 'sel' : ''} ${k === ymd(now) ? 'today' : ''}">${d}<span class="dots">${ss.map(s => `<i class="${s.type}"></i>`).join('')}</span></button>`;
  }
  const sel = (byDay[histSel] || []).slice().reverse();
  const monthName = first.toLocaleDateString('id-ID', {month: 'long', year: 'numeric'});
  let h = `<h1>Riwayat</h1><div class="small muted">${S.sessions.length} sesi tercatat</div>
    <div class="calhd" style="margin-top:12px"><button id="pm" aria-label="Bulan sebelumnya">‹</button><b>${monthName}</b><button id="nm" aria-label="Bulan berikutnya">›</button></div>
    <div class="cal">${cells}</div>
    <div class="row small"><i class="push" style="width:12px;height:12px;border:2px solid #000"></i>Push <i class="pull" style="width:12px;height:12px;border:2px solid #000"></i>Pull <i class="leg" style="width:12px;height:12px;border:2px solid #000"></i>Leg</div>`;
  h += sel.length ? sel.map(s => `<div class="card sess"><div class="row"><span class="chip ${s.type}" style="--tc:var(--${s.type})">${TYPES[s.type].name}</span><b class="grow">${fmtDate(s.start)}</b><span class="small">${fmtDur(s.end - s.start)}</span></div>
      <div style="margin-top:8px">${s.entries.map(e => `<div class="row small" style="padding:3px 0"><span class="grow">${esc(e.name)}</span><span class="muted">${fmtSets(e.sets)}</span></div>`).join('')}</div>
      ${s.note ? `<div class="small" style="margin-top:8px;border-top:2px dashed #000;padding-top:8px">${esc(s.note)}</div>` : ''}
      <button class="ghost small" data-del="${s.id}">Hapus sesi ini</button></div>`).join('')
    : `<div class="card sess small">Tidak ada workout di tanggal ini.</div>`;
  app.innerHTML = h;
  const mv = d => { histM += d; if (histM < 0) { histM = 11; histY--; } if (histM > 11) { histM = 0; histY++; } render(); };
  document.getElementById('pm').onclick = () => mv(-1);
  document.getElementById('nm').onclick = () => mv(1);
  app.querySelectorAll('.cal [data-k]').forEach(b => b.onclick = () => { histSel = b.dataset.k; render(); });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('Hapus sesi ini dari riwayat? XP dan lencananya ikut dihitung ulang. Tidak bisa dibatalkan.')) return;
    S.sessions = S.sessions.filter(s => s.id !== +b.dataset.del); save(); render();
  });
}

function progress() {
  const ids = [...new Set(S.sessions.flatMap(s => s.entries.map(e => e.ex)))];
  let h = `<h1>Progres</h1>`;
  if (!ids.length) { app.innerHTML = h + `<div class="card">Grafik muncul setelah kamu menyimpan minimal satu workout.</div>`; return; }
  if (!ids.includes(progEx)) progEx = ids[0];
  const nameOf = id => (S.sessions.flatMap(s => s.entries).find(e => e.ex === id) || {name: exName(id)}).name;
  const from = progRange ? Date.now() - progRange * 30.5 * 864e5 : 0;
  const data = S.sessions.filter(s => s.start >= from).map(s => ({ts: s.start, e: s.entries.find(e => e.ex === progEx)})).filter(d => d.e);
  const M = {beban: ['Beban terberat', 'kg', d => Math.max(...d.e.sets.map(s => s.kg))], rep: ['Total repetisi', 'rep', d => d.e.sets.reduce((n, s) => n + s.reps, 0)], volume: ['Volume', 'rep×kg', d => vol(d.e.sets)]};
  const [label, unit, f] = M[progMetric], vals = data.map(f);
  h += `<select id="pick" aria-label="Pilih gerakan">${ids.map(id => `<option value="${esc(id)}" ${id === progEx ? 'selected' : ''}>${esc(nameOf(id))}</option>`).join('')}</select>
    <div class="seg" style="margin-top:12px">${[[1, '1B'], [3, '3B'], [6, '6B'], [0, 'Semua']].map(([v, l]) => `<button data-r="${v}" class="${v === progRange ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="card" style="margin-top:12px;padding:8px">${vals.length ? chart(vals, data.map(d => new Date(d.ts).toLocaleDateString('id-ID', {day: 'numeric', month: 'short'}))) : '<div class="small" style="padding:30px 8px;text-align:center">Belum ada data di rentang ini.</div>'}</div>
    <div class="chips">${Object.keys(M).map(k => `<button data-m="${k}" class="${k === progMetric ? 'on' : ''}">${k[0].toUpperCase() + k.slice(1)}</button>`).join('')}</div>`;
  if (vals.length) {
    const best = Math.max(...vals), ch = vals[vals.length - 1] - vals[0];
    h += `<div class="stats"><div class="card"><b>${num(best)}</b><small>terbaik (${unit})</small></div><div class="card"><b>${ch > 0 ? '+' : ''}${num(ch)}</b><small>perubahan</small></div><div class="card"><b>${vals.length}</b><small>sesi</small></div></div>
      <div class="small muted">${label} per sesi untuk ${esc(nameOf(progEx))}.</div>`;
  }
  app.innerHTML = h;
  document.getElementById('pick').onchange = e => { progEx = e.target.value; render(); };
  app.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { progRange = +b.dataset.r; render(); });
  app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { progMetric = b.dataset.m; render(); });
}
function chart(vals, labels) {
  const W = 340, H = 200, px = 28, pt = 24, pb = 26, n = vals.length;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const x = i => n === 1 ? W / 2 : px + i * (W - px * 2) / (n - 1), y = v => H - pb - (v - lo) / span * (H - pt - pb);
  const p = vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}">`;
  [0, .5, 1].forEach(f => { const yy = pt + f * (H - pt - pb); s += `<line class="gl" x1="${px - 10}" y1="${yy}" x2="${W - px + 10}" y2="${yy}"/>`; });
  if (n > 1) s += `<polygon class="ar" points="${x(0)},${H - pb} ${p} ${x(n - 1)},${H - pb}"/>`;
  s += `<polyline class="ln" points="${p}"/>`;
  vals.forEach((v, i) => {
    s += `<rect class="pt" x="${x(i) - 5}" y="${y(v) - 5}" width="10" height="10"/>`;
    if (n <= 8 || i === n - 1 || v === hi) s += `<text x="${x(i)}" y="${y(v) - 10}" text-anchor="middle">${num(v)}</text>`;
  });
  s += `<text x="${x(0)}" y="${H - 6}" text-anchor="${n === 1 ? 'middle' : 'start'}">${labels[0]}</text>`;
  if (n > 1) s += `<text x="${x(n - 1)}" y="${H - 6}" text-anchor="end">${labels[n - 1]}</text>`;
  return s + '</svg>';
}

function badges() {
  const st = stats(S.sessions);
  let h = `<h1>Lencana</h1><div class="lvbig"><span class="n">${st.level}</span><div class="grow"><b>LEVEL ${st.level}</b>
    <div class="bar" style="margin:6px 0"><i style="width:${Math.round(st.into / st.span * 100)}%"></i></div><div class="small">${num(st.span - st.into)} XP lagi · total ${num(st.xp)} XP</div></div></div>
    <div class="stats"><div class="card"><b>${st.sessions}</b><small>workout</small></div><div class="card"><b>${num(st.kg)}</b><small>kg total</small></div><div class="card"><b>${st.prs}</b><small>rekor</small></div></div>
    <h2>${st.badges.length} / ${BADGES.length} lencana</h2>
    <div class="badges">${BADGES.map(b => { const ok = st.badges.includes(b.id); return `<div class="card badge${ok ? '' : ' lock'}"><span class="ic">${ok ? b.ic : '?'}</span><b>${b.name}</b><small>${b.desc}</small></div>`; }).join('')}</div>
    <h2>Fakta terkumpul ${S.facts.length} / ${FACTS.length}</h2>
    <div class="small muted">Fakta terbuka setiap kamu naik level, dapat lencana, atau memecahkan rekor.</div>
    <div class="factlist">${S.facts.length ? S.facts.slice().reverse().map(i => `<div class="card"><small>FAKTA #${i + 1}</small>${esc(FACTS[i])}</div>`).join('') : '<div class="card small">Belum ada. Selesaikan workout pertamamu!</div>'}</div>
    <div class="card small" style="margin-top:14px"><b>Cara dapat XP:</b> setiap set = 10 + repetisi + kg. Selesai workout +${XP_SESSION}. Setiap rekor baru +${XP_PR}.</div>`;
  app.innerHTML = h;
}

function settings() {
  const row = (id, label, v) => `<button id="${id}">${label}<span class="v">${v} ›</span></button>`;
  app.innerHTML = `<h1>Atur</h1>
    <div class="grouplbl">Latihan</div>
    <div class="card group">${row('gTimer', 'Timer istirahat', S.rest + ' dtk')}</div>
    <div class="grouplbl">Daftar gerakan</div>
    <div class="card group">${Object.keys(TYPES).map(k => row('gP' + k, TYPES[k].name, S.plan[k].length + ' gerakan')).join('')}</div>
    <div class="grouplbl">Data di iPhone ini</div>
    <div class="card group">${row('exp', 'Backup data', '')}${row('imp', 'Restore dari backup', '')}</div>
    <input type="file" id="file" accept="application/json,.json" style="display:none">
    <div class="small muted" style="margin:8px 2px">Data hanya tersimpan di iPhone ini. Backup rutin dan simpan filenya ke Files/iCloud.</div>
    <div class="card group" style="margin-top:22px"><button id="reset" style="color:#d10045">Hapus semua data &amp; reset<span class="v">›</span></button></div>
    <div class="small muted" style="text-align:center;margin-top:20px">PPL Log · ${S.sessions.length} sesi · berjalan offline</div>`;
  document.getElementById('gTimer').onclick = () => go('timer');
  Object.keys(TYPES).forEach(k => { document.getElementById('gP' + k).onclick = () => go('plan', k); });
  document.getElementById('exp').onclick = backup;
  const file = document.getElementById('file');
  document.getElementById('imp').onclick = () => file.click();
  file.onchange = () => {
    const f = file.files[0]; if (!f) return;
    f.text().then(txt => {
      const d = JSON.parse(txt);
      if (!d || !Array.isArray(d.sessions) || !d.plan) throw new Error('format');
      if (!confirm(`Restore ${d.sessions.length} sesi dari backup? Data di iPhone ini sekarang akan diganti.`)) return;
      S = {...fresh(), ...d}; save(); toast('Data berhasil dipulihkan'); render();
    }).catch(() => alert('File ini bukan backup PPL Log yang valid.'));
    file.value = '';
  };
  document.getElementById('reset').onclick = () => {
    if (!confirm(`Hapus SEMUA data (${S.sessions.length} sesi, XP, lencana, fakta, daftar gerakan, pengaturan)? Tidak bisa dibatalkan. Lakukan Backup dulu kalau masih perlu.`)) return;
    if (!confirm('Yakin? Ini terakhir kali ditanya.')) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = fresh(); lastResult = null; progEx = null; histY = null; tickRest();
    toast('Data direset. App kembali ke kondisi awal.'); go('home');
  };
}

function timer() {
  app.innerHTML = `<h1>Timer istirahat</h1><div class="small muted">Berjalan otomatis setelah kamu menyelesaikan set.</div>
    <div class="card" style="margin-top:16px;text-align:center"><div style="font:400 64px/1 var(--display)">${S.rest}</div><div class="small">detik</div>
    <div class="row" style="margin-top:14px"><button class="grow" id="rm">−15</button><button class="grow" id="rp">+15</button></div></div>
    <div class="small muted" style="margin-top:10px">Antara 30 dan 300 detik.</div>`;
  const set = d => { S.rest = clamp(S.rest + d, 30, 300); save(); render(); };
  document.getElementById('rm').onclick = () => set(-15);
  document.getElementById('rp').onclick = () => set(15);
}

function plan() {
  const list = S.plan[editType], avail = [...Object.keys(EX), ...Object.keys(S.custom)].filter(id => !list.includes(id));
  app.innerHTML = `<h1>Gerakan ${TYPES[editType].name}</h1><div class="small muted">Urutan di sini menjadi urutan saat workout.</div>
    <div class="list-edit">${list.map((id, i) => `<div class="card row"><span class="grow">${esc(exName(id))}</span>
      <button data-up="${i}" ${i ? '' : 'disabled'} aria-label="Naikkan">↑</button><button data-dn="${i}" ${i < list.length - 1 ? '' : 'disabled'} aria-label="Turunkan">↓</button><button class="danger" data-rm="${i}" aria-label="Hapus">✕</button></div>`).join('')}</div>
    ${avail.length ? `<label class="lb" for="addSel">Tambah dari daftar</label><div class="row"><select id="addSel" class="grow">${avail.map(id => `<option value="${esc(id)}">${esc(exName(id))}</option>`).join('')}</select><button id="add">Tambah</button></div>` : ''}
    <label class="lb" for="newName">Gerakan buatan sendiri</label><div class="row"><input type="text" id="newName" class="grow" placeholder="Nama gerakan" maxlength="40"><button id="addNew">Buat</button></div>
    <button class="ghost" style="margin-top:14px" id="resetPlan">Kembalikan daftar ${TYPES[editType].name} ke bawaan</button>`;
  const mv = (i, d) => { [list[i], list[i + d]] = [list[i + d], list[i]]; save(); render(); };
  app.querySelectorAll('[data-up]').forEach(b => b.onclick = () => mv(+b.dataset.up, -1));
  app.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => mv(+b.dataset.dn, 1));
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    const i = +b.dataset.rm;
    if (!confirm(`Hapus "${exName(list[i])}" dari daftar ${TYPES[editType].name}? Riwayatnya tetap tersimpan.`)) return;
    list.splice(i, 1); save(); render();
  });
  const add = document.getElementById('add'); if (add) add.onclick = () => { list.push(document.getElementById('addSel').value); save(); render(); };
  document.getElementById('addNew').onclick = () => {
    const n = document.getElementById('newName').value.trim(); if (!n) return;
    const id = 'c_' + Date.now(); S.custom[id] = {name: n}; list.push(id); save(); render();
  };
  document.getElementById('resetPlan').onclick = () => {
    if (!confirm(`Kembalikan daftar ${TYPES[editType].name} ke bawaan?`)) return;
    S.plan[editType] = [...DEFAULT_PLAN[editType]]; save(); render();
  };
}

async function backup() {
  const name = 'ppllog-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const blob = new Blob([JSON.stringify(S)], {type: 'application/json'});
  const f = new File([blob], name, {type: 'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: 'Backup PPL Log'}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

render();
tickRest();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'update') document.body.classList.add('hasUpd'); });
  // The worker compares fresh files with its cached copy and messages us when they differ.
  const checkUpdate = () => { if (navigator.onLine) fetch('index.html').catch(() => {}); };
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
}
</script>
