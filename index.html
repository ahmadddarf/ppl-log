<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PPL Log">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>PPL Log</title>
<style>
:root{
  color-scheme:dark;
  --accent:#7dd3fc;--accent2:#38bdf8;--ink:#041824;
  --text:#f4f9fd;--muted:#8da2b3;--danger:#ff7b7b;--ok:var(--accent);
  --bg:#000;--line:rgba(255,255,255,.12);--card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.1);
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --glass-bg:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
  --glass-edge:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -1px 0 rgba(255,255,255,.04),0 12px 32px -14px rgba(0,0,0,.9);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#000}
html,body{margin:0;color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 112px);touch-action:manipulation;-webkit-user-select:none;user-select:none;min-height:100vh;overflow-x:hidden}

/* ambient light behind the glass */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:#000}
.bg i{position:absolute;border-radius:50%;width:90vmax;height:90vmax;background:radial-gradient(circle,rgba(125,211,252,.30),rgba(125,211,252,0) 68%)}
.bg i:nth-child(1){top:-48vmax;left:-38vmax;animation:drift1 24s ease-in-out infinite alternate}
.bg i:nth-child(2){bottom:-52vmax;right:-42vmax;opacity:.75;background:radial-gradient(circle,rgba(56,189,248,.28),rgba(56,189,248,0) 68%);animation:drift2 30s ease-in-out infinite alternate}
.bg i:nth-child(3){top:38%;left:35%;width:46vmax;height:46vmax;opacity:.3;animation:drift3 36s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,-12vmax) scale(1.2)}}
@keyframes drift3{to{transform:translate(-14vmax,10vmax) scale(.8)}}

button{font:inherit;color:inherit;border:1px solid rgba(255,255,255,.14);background:var(--glass-bg);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);border-radius:14px;padding:12px 16px;cursor:pointer;transition:transform .3s var(--spring),background .25s,opacity .2s,border-color .25s}
button:active{transform:scale(.95)}
button:disabled{opacity:.3}
button.primary{background:linear-gradient(180deg,#b9e8ff,#5cc4f8);color:var(--ink);font-weight:700;border-color:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 8px 26px -6px rgba(94,196,248,.6)}
button.ghost{background:none;border:0;box-shadow:none;color:var(--muted);padding:8px 4px}
button.danger{background:rgba(255,123,123,.08);border-color:rgba(255,123,123,.35);color:var(--danger);box-shadow:none}

h1{font-size:32px;line-height:1.12;font-weight:800;letter-spacing:-.02em;margin:14px 0 6px;background:linear-gradient(180deg,#fff 30%,#a9e0fb);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:18px;font-weight:700;margin:26px 2px 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* glass surfaces */
.card,.big,.exitem,details,.cue,.herobox,.chartbox,.stat div,.list-edit .row,.pr{
  position:relative;background:var(--glass-bg);border:1px solid rgba(255,255,255,.13);box-shadow:var(--glass-edge);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%)}
.card::after,.big::after,.exitem::after,details::after,.cue::after,.herobox::after,.chartbox::after,.stat div::after,.list-edit .row::after,.pr::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .4s;
  background:radial-gradient(200px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.2),transparent 70%)}
.lit::after{opacity:1}
.card{border-radius:20px;padding:14px;margin:10px 0}
.cue{border-radius:18px;padding:12px 14px;margin:10px 0;color:#d6e4ee}
details{border-radius:18px;margin:8px 0;padding:12px 14px}
details summary{list-style:none;cursor:pointer}
details summary::-webkit-details-marker{display:none}
details[open]{border-color:rgba(125,211,252,.35)}
.list-edit .row{border-radius:14px;padding:8px 10px;margin:6px 0}
.list-edit button{padding:8px 11px}
.pr{border-radius:16px;padding:10px 12px;margin:6px 0;border-color:rgba(125,211,252,.45);background:linear-gradient(145deg,rgba(125,211,252,.2),rgba(125,211,252,.05))}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{border-radius:18px;padding:14px 4px}
.stat b{display:block;font-size:26px}

/* home cards */
.big{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px;margin:12px 0;border-radius:26px}
.big .ic{flex:none;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:rgba(125,211,252,.14);border:1px solid rgba(125,211,252,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 26px -4px rgba(125,211,252,.55)}
.big .ic svg{width:28px;height:28px;stroke:var(--accent);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.big b{display:block;font-size:28px;letter-spacing:.06em}
.big.next{border-color:rgba(125,211,252,.5);box-shadow:var(--glass-edge),0 0 36px -10px rgba(125,211,252,.55)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:99px;background:rgba(125,211,252,.18);border:1px solid rgba(125,211,252,.45);color:var(--accent);vertical-align:middle}

/* exercise list */
.exitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px;margin:8px 0;border-radius:22px}
.exitem svg{width:72px;height:70px;flex:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:15px}
.exitem .name{font-weight:600}
.done-mark{color:var(--accent);font-weight:700;white-space:nowrap;background:rgba(125,211,252,.14);border:1px solid rgba(125,211,252,.4);border-radius:99px;padding:3px 10px;font-size:13px}

/* animated figures */
svg.fig .floor{stroke:rgba(255,255,255,.16);stroke-width:1.5}
svg.fig .prop{stroke:rgba(255,255,255,.38);stroke-width:2;fill:none}
svg.fig .prop rect{fill:rgba(255,255,255,.2)}
svg.fig path,svg.fig line.torso{stroke:#fff;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;fill:none}
svg.fig .back{opacity:.4}
svg.fig circle.head{fill:#fff}
svg.fig .db{fill:#000;stroke:var(--accent);stroke-width:2.4}
.herobox{border-radius:26px;padding:10px;margin:10px 0;overflow:hidden}
.herobox::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 110%,rgba(125,211,252,.22),transparent 65%);pointer-events:none}
.hero{display:block;position:relative;width:100%;height:auto;max-height:230px}

/* wheels */
.wheel-wrap{position:relative;height:120px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.wheel-wrap::before{content:"";position:absolute;left:4px;right:4px;top:39px;height:40px;border-radius:11px;background:rgba(125,211,252,.14);border:1px solid rgba(125,211,252,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 18px -4px rgba(125,211,252,.5);pointer-events:none}
.wheel{height:118px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  -webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:40px}
.wheel .it{height:40px;line-height:40px;text-align:center;font-size:21px;color:rgba(255,255,255,.3);scroll-snap-align:center;font-variant-numeric:tabular-nums;transition:color .2s,transform .25s var(--spring),text-shadow .2s}
.wheel .it.near{color:rgba(255,255,255,.6);transform:scale(1.05)}
.wheel .it.sel{color:#fff;font-weight:700;transform:scale(1.2);text-shadow:0 0 16px rgba(125,211,252,.8)}
.setrow{display:grid;grid-template-columns:48px 1fr 1fr 56px;gap:8px;align-items:center;margin:8px 0}
.setrow.bw{grid-template-columns:48px 1fr 56px}
.setrow .lbl{font-weight:700;color:var(--muted);font-size:14px;text-align:center}
.tick{height:56px;width:56px;padding:0;font-size:26px;border-radius:18px;color:var(--muted)}
.tick.on{background:linear-gradient(180deg,#b9e8ff,#5cc4f8);color:var(--ink);border-color:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 0 24px -2px rgba(94,196,248,.7)}
.tick.pop{animation:pop .55s var(--spring)}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
.colhead{display:grid;grid-template-columns:48px 1fr 1fr 56px;gap:8px;font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
.colhead.bw{grid-template-columns:48px 1fr 56px}
.setcount{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center}

/* floating nav pill */
nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(calc(100% - 32px),420px);transform:translateX(-50%);z-index:5;transition:transform .55s var(--spring),opacity .3s}
nav.hide{transform:translate(-50%,160%);opacity:0;pointer-events:none}
nav .pill{position:relative;display:flex;padding:6px;border-radius:32px;background:rgba(14,22,30,.5);border:1px solid rgba(255,255,255,.16);box-shadow:var(--glass-edge);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%)}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/4);border-radius:26px;background:rgba(125,211,252,.16);border:1px solid rgba(125,211,252,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 20px -4px rgba(125,211,252,.55);transition:transform .5s var(--spring)}
nav button{position:relative;z-index:1;flex:1;background:none;border:0;box-shadow:none;font-size:11px;color:var(--muted);padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .3s,transform .3s var(--spring)}
nav button svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}

/* back button, update banner, toast, rest timer */
#back{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:12px;width:48px;height:48px;padding:0;border-radius:50%;background:rgba(125,211,252,.2);border:1px solid rgba(125,211,252,.55);display:none;align-items:center;justify-content:center;z-index:7;-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 0 24px -2px rgba(125,211,252,.5),0 6px 16px rgba(0,0,0,.5)}
#back svg{width:26px;height:26px;stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
body.hasBack,body.hasUpd{padding-top:calc(env(safe-area-inset-top) + 70px)}
body.hasBack #back{display:flex;animation:backin .45s var(--spring)}
@keyframes backin{from{opacity:0;transform:translateX(-18px) scale(.8)}}
#upd{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:12px;right:12px;height:48px;display:none;align-items:center;gap:10px;padding:0 6px 0 16px;border-radius:24px;z-index:8;background:rgba(14,22,30,.55);border:1px solid rgba(125,211,252,.5);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--glass-edge),0 0 26px -6px rgba(125,211,252,.5)}
body.hasBack #upd{left:68px}
body.hasUpd #upd{display:flex;animation:rise .5s var(--spring)}
#upd span{flex:1;font-size:14px;font-weight:600;color:var(--accent)}
#upd button{background:linear-gradient(180deg,#b9e8ff,#5cc4f8);color:var(--ink);border:0;font-weight:700;padding:8px 14px;border-radius:20px;font-size:14px}
#toast{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 10px);border-radius:22px;padding:14px;text-align:center;font-weight:600;color:var(--accent);z-index:9;background:rgba(14,22,30,.6);border:1px solid rgba(125,211,252,.5);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--glass-edge),0 0 26px -6px rgba(125,211,252,.5);opacity:0;transform:translateY(-20px) scale(.96);pointer-events:none;transition:opacity .3s,transform .5s var(--spring)}
#toast.show{opacity:1;transform:none}
#rest{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 92px);display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:28px;z-index:6;background:rgba(14,22,30,.55);border:1px solid rgba(125,211,252,.35);-webkit-backdrop-filter:blur(26px) saturate(190%);backdrop-filter:blur(26px) saturate(190%);box-shadow:var(--glass-edge),0 0 34px -8px rgba(125,211,252,.5);opacity:0;transform:translateY(26px) scale(.95);pointer-events:none;transition:opacity .35s var(--ease),transform .55s var(--spring)}
#rest.show{opacity:1;transform:none;pointer-events:auto}
#rest .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
#rest button{padding:10px 12px}
body.noNav #rest{bottom:calc(env(safe-area-inset-bottom) + 16px)}
.ring{width:48px;height:48px;flex:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .trk{stroke:rgba(255,255,255,.12)}
.ring .bar{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:113.1;stroke-dashoffset:0;transition:stroke-dashoffset .35s linear;filter:drop-shadow(0 0 4px rgba(125,211,252,.8))}

/* forms */
textarea,select,input[type=text]{width:100%;font:inherit;color:var(--text);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px;-webkit-user-select:text;user-select:text;outline:0;transition:border-color .25s,box-shadow .25s}
textarea:focus,select:focus,input[type=text]:focus{border-color:rgba(125,211,252,.7);box-shadow:0 0 0 3px rgba(125,211,252,.18)}
textarea{min-height:70px;resize:vertical}
.seg{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 0;background:transparent;border:1px solid transparent;box-shadow:none;color:var(--muted)}
.seg button.on{background:rgba(125,211,252,.16);border-color:rgba(125,211,252,.4);color:var(--accent);font-weight:700}

/* chart and finish screen */
.chartbox{border-radius:22px;padding:6px;margin:8px 0}
.chart{display:block;width:100%;height:180px}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .15s forwards;filter:drop-shadow(0 0 5px rgba(125,211,252,.7))}
.chart .area{opacity:0;animation:fadein .9s ease .6s forwards}
.chart .dot{fill:var(--accent);transform-box:fill-box;transform-origin:center;animation:dotin .5s var(--spring) both}
.chart text{fill:var(--muted);font-size:10px}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes dotin{from{transform:scale(0)}}
.burst{width:84px;height:84px;margin:14px 0 4px}
.burst circle,.burst path{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:150;stroke-dashoffset:150;animation:draw2 .9s var(--ease) .1s forwards}
.burst path{animation-delay:.5s;animation-duration:.5s}
.burst{filter:drop-shadow(0 0 10px rgba(125,211,252,.7))}
@keyframes draw2{to{stroke-dashoffset:0}}

/* page transitions: children rise in one after another */
#app.fwd>*{animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
#app.bck>*{animation:slideback .55s var(--ease) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes slideback{from{opacity:0;transform:translateX(-26px) scale(.985)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<button id="back" aria-label="Kembali"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
<div id="upd"><span>Versi baru tersedia</span><button id="updBtn">Muat ulang</button></div>
<div id="app"></div>
<div id="rest"><svg class="ring" viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="18"/><circle class="bar" id="restBar" cx="22" cy="22" r="18"/></svg><div class="grow"><div class="small muted">Istirahat</div><div class="t" id="restT">1:30</div></div>
  <button id="restPlus">+15 dtk</button><button id="restSkip">Lewati</button></div>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
'use strict';
const KEY = 'ppllog-v1';
const TYPES = {
  push: {name: 'PUSH', sub: 'Dada · Bahu · Trisep', icon: 'M4 12h14M13 6l6 6-6 6'},
  pull: {name: 'PULL', sub: 'Punggung · Bisep', icon: 'M20 12H6M11 6l-6 6 6 6'},
  leg:  {name: 'LEG',  sub: 'Kaki · Bokong', icon: 'M7 20V9M7 9l-3 3M7 9l3 3M17 4v11M17 15l-3-3M17 15l3-3'},
};
const NEXT = {push: 'pull', pull: 'leg', leg: 'push'};
const DEFAULT_PLAN = {
  push: ['pushup', 'floorpress', 'shoulderpress', 'lateral', 'dips', 'ohtri'],
  pull: ['bentrow', 'onerow', 'reardelt', 'superman', 'curl', 'hammer'],
  leg:  ['goblet', 'rdl', 'lunge', 'bss', 'bridge', 'calf'],
};
const REPS = range(5, 20), KGS = range(0, 20), SETS = range(1, 4);

/* Animated figure poses. Canvas 100x96, floor at y=88, figure faces right.
   hip:[x,y], t: torso angle (0 = upright, 90 = lying with head right),
   h1/h2: hand targets, f1/f2: foot targets (solved with 2-bone IK),
   ha1/ha2: [upper arm, forearm] absolute angles (0 = down, + = forward).
   eb/kb: elbow/knee bend side (+1 clockwise on screen). db: dumbbells drawn (1 or 2). */
const EX = {
  pushup: {name: 'Push-up', bw: 1, cue: 'Badan lurus dari kepala sampai tumit, perut dikencangkan. Turun sampai dada hampir menyentuh lantai, siku sekitar 45° dari badan, lalu dorong naik.',
    A: {hip: [38, 74], t: 65, h1: [62, 88], f1: [9, 88]}, B: {hip: [40, 81], t: 82}},
  floorpress: {name: 'Dumbbell Floor Press', db: 2, eb: [-1, -1], kb: [1, 1], td: -1, cue: 'Tiduran telentang, lutut ditekuk, kaki menapak. Turunkan dumbbell sampai lengan atas menyentuh lantai, lalu dorong lurus ke atas dada.',
    A: {hip: [35, 84], t: 90, h1: [61, 59], f1: [17, 88]}, B: {h1: [61, 74]}},
  shoulderpress: {name: 'Dumbbell Shoulder Press', db: 2, cue: 'Berdiri tegak, perut dikencangkan. Dorong dumbbell dari depan bahu lurus ke atas kepala. Jangan melengkungkan punggung bawah.',
    A: {hip: [50, 56], t: 0, h1: [54, 25], f1: [52, 88], f2: [47, 88]}, B: {h1: [51, 7]}},
  lateral: {name: 'Lateral Raise', front: 1, db: 2, eb: [1, -1], cue: 'Tampak depan. Siku sedikit ditekuk, angkat dumbbell ke samping sampai setinggi bahu. Turunkan pelan, jangan diayun.',
    A: {hip: [50, 56], t: 0, h1: [58, 55], h2: [42, 55], f1: [55, 88], f2: [45, 88]}, B: {h1: [80, 33], h2: [20, 33]}},
  dips: {name: 'Chair Dips', bw: 1, chair: {x: 12, y: 62, w: 26, back: 'l'}, cue: 'Tangan di tepi kursi di belakang badan, jari menghadap depan. Turunkan badan sampai siku ±90°, lalu dorong naik. Pastikan kursi tidak bergeser.',
    A: {hip: [44, 63], t: -8, h1: [37, 62], f1: [64, 88]}, B: {hip: [44, 76]}},
  ohtri: {name: 'Overhead Triceps Extension', db: 1, cue: 'Pegang satu dumbbell dengan dua tangan di atas kepala. Turunkan ke belakang kepala dengan siku tetap menunjuk ke atas, lalu luruskan lagi.',

  for (const k of Object.keys(TYPES)) {
    const T = TYPES[k], l = lastOfType(k);
    const nx = k === suggest && !S.active;
    h += `<button class="big${nx ? ' next' : ''}" data-t="${k}"><span class="ic"><svg viewBox="0 0 24 24"><path d="${T.icon}"/></svg></span><span class="grow"><b>${T.name}</b>
      ${nx ? '<span class="badge">Giliran berikutnya</span>' : ''}<div>${T.sub}</div><div class="muted small">${l ? 'Terakhir ' + ago(l.start) : 'Belum pernah'} · ${S.plan[k].length} gerakan</div></span></button>`;
  }
  app.innerHTML = h;
  const r = document.getElementById('resume'); if (r) r.onclick = () => go('workout');
  app.querySelectorAll('.big').forEach(b => b.onclick = () => {
    const k = b.dataset.t;
    if (S.active) {
      if (S.active.type === k) return go('workout');
      if (!confirm(`Workout ${TYPES[S.active.type].name} masih berjalan. Batalkan dan mulai ${TYPES[k].name}? Set yang belum disimpan akan hilang.`)) return;
    }
    S.active = {type: k, start: Date.now(), note: '', order: [...S.plan[k]], ex: {}};
    S.restEnd = 0; save(); go('workout');
  });
}

function entryFor(id) {
  const a = S.active;
  if (!a.ex[id]) {
    const prev = lastSets(id), bw = exInfo(id).bw;
    a.ex[id] = {sets: prev ? prev.map(s => ({reps: s.reps, kg: s.kg, done: false})) : [1, 2, 3].map(() => ({reps: 10, kg: bw ? 0 : 5, done: false}))};
  }
  return a.ex[id];
}

function workout() {
  const a = S.active; if (!a) return go('home');
  const T = TYPES[a.type];
  let h = `<div class="top" style="justify-content:flex-end"><div class="muted" style="font-variant-numeric:tabular-nums"><span id="elapsed">${fmtDur(Date.now() - a.start)}</span></div></div>
    <h1>${T.name}</h1><div class="muted">${T.sub} · ketuk gerakan untuk mencatat</div>`;
  a.order.forEach(id => {
    const prev = lastSets(id), e = a.ex[id], n = e ? e.sets.filter(s => s.done).length : 0;
    h += `<button class="exitem" data-id="${esc(id)}"><svg data-fig="${esc(id)}"></svg><div class="grow"><div class="name">${esc(exName(id))}</div>
      <div class="muted small">${prev ? 'Lalu: ' + fmtSets(prev) : 'Belum pernah dicatat'}</div></div>
      ${n ? `<div class="done-mark">${n}/${e.sets.length} ✓</div>` : '<div class="muted">›</div>'}</button>`;
  });
  h += `<h2>Catatan sesi</h2><textarea id="note" placeholder="Opsional, misal: bahu kiri agak pegal">${esc(a.note)}</textarea>
    <div class="row" style="margin-top:16px"><button class="danger" id="cancel">Batalkan</button><button class="primary grow" id="finish">Selesai Workout</button></div>`;
  app.innerHTML = h;
  app.querySelectorAll('svg[data-fig]').forEach(s => mountFig(s, s.dataset.fig));
  app.querySelectorAll('.exitem').forEach(b => b.onclick = () => go('exercise', b.dataset.id));
  document.getElementById('note').oninput = e => { a.note = e.target.value; save(); };
  document.getElementById('cancel').onclick = () => {
    if (!confirm('Batalkan workout ini? Semua set di sesi ini tidak akan disimpan.')) return;
    S.active = null; S.restEnd = 0; save(); go('home');
  };
  document.getElementById('finish').onclick = finish;
}

function exercise() {
  const a = S.active; if (!a) return go('home');
  const id = curEx, info = exInfo(id), e = entryFor(id), bw = !!info.bw, prev = lastSets(id);
  save();
  const i = a.order.indexOf(id), next = a.order[i + 1];
  app.innerHTML = `<div class="top" style="justify-content:flex-end"><div class="muted">${i + 1}/${a.order.length}</div></div>
    <h1>${esc(info.name)}</h1>
    <div class="herobox"><svg class="hero" id="hero"></svg></div>
    ${info.cue ? `<div class="cue">${esc(info.cue)}</div>` : ''}
    <div class="muted">${prev ? 'Sesi lalu: <b style="color:var(--text)">' + fmtSets(prev) + '</b>. Coba samai atau kalahkan!' : 'Gerakan baru, belum ada catatan sebelumnya.'}</div>
    <div class="card setcount"><div><b>Jumlah set</b><div class="muted small">Geser roda untuk memilih</div></div><div id="setWheel"></div></div>
    <div class="colhead ${bw ? 'bw' : ''}"><div></div><div>Repetisi</div>${bw ? '' : '<div>Beban (kg)</div>'}<div>Selesai</div></div>
    <div id="sets"></div>
    <div class="muted small" style="margin:8px 0 14px">Ketuk ✓ setelah menyelesaikan set. Timer istirahat ${S.rest} detik akan berjalan otomatis.</div>
    <button class="primary" style="width:100%" id="next">${next ? 'Berikutnya: ' + esc(exName(next)) + ' ›' : 'Kembali ke daftar ›'}</button>`;
  mountFig(document.getElementById('hero'), id);
  document.getElementById('next').onclick = () => next ? go('exercise', next) : go('workout');
  document.getElementById('setWheel').appendChild(wheel(SETS, e.sets.length, n => {
    if (n === e.sets.length) return;
    while (e.sets.length < n) { const l = e.sets[e.sets.length - 1]; e.sets.push({reps: l.reps, kg: l.kg, done: false}); }
    e.sets.length = n; save(); renderSets();
  }));
  function renderSets() {
    const box = document.getElementById('sets'); box.innerHTML = '';
    e.sets.forEach((s, k) => {
      const row = document.createElement('div'); row.className = 'setrow' + (bw ? ' bw' : '');
      row.innerHTML = `<div class="lbl">Set ${k + 1}</div>`;
      row.appendChild(wheel(REPS, s.reps, v => { s.reps = v; save(); }));
      if (!bw) row.appendChild(wheel(KGS, s.kg, v => { s.kg = v; save(); }));
      const b = document.createElement('button'); b.className = 'tick' + (s.done ? ' on' : ''); b.textContent = '✓';
      b.onclick = () => {
        unlockAudio();
        s.done = !s.done; b.classList.toggle('on', s.done); save();
        if (s.done) { b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); startRest(); }
      };
      row.appendChild(b); box.appendChild(row);
    });
  }
  renderSets();
}

function finish() {
  const a = S.active;
  const entries = a.order.filter(id => a.ex[id]).map(id => ({ex: id, name: exName(id), sets: a.ex[id].sets.filter(s => s.done).map(s => ({reps: s.reps, kg: s.kg}))})).filter(e => e.sets.length);
  if (!entries.length) {
    if (confirm('Belum ada set yang dicentang ✓. Batalkan sesi ini?')) { S.active = null; S.restEnd = 0; save(); go('home'); }
    return;
  }
  if (!confirm('Selesaikan dan simpan workout ini?')) return;
  const prs = [];
  for (const e of entries) {
    const prevSets = S.sessions.flatMap(s => s.entries.filter(x => x.ex === e.ex).flatMap(x => x.sets));
    if (!prevSets.length) continue;
    const beat = e.sets.filter(s => !prevSets.some(p => p.kg >= s.kg && p.reps >= s.reps));
    if (beat.length) {
      const b = beat.sort((x, y) => y.kg - x.kg || y.reps - x.reps)[0];
      prs.push(e.name + ': ' + (b.kg ? b.kg + ' kg × ' + b.reps + ' rep' : b.reps + ' rep'));
    }
  }
  const sess = {id: Date.now(), type: a.type, start: a.start, end: Date.now(), note: a.note.trim(), entries};
  S.sessions.push(sess); S.active = null; S.restEnd = 0; save();
  lastResult = {sess, prs}; go('done');
}

function done() {
  if (!lastResult) return go('home');
  const {sess, prs} = lastResult, sets = sess.entries.flatMap(e => e.sets);
  let h = `<svg class="burst" viewBox="0 0 52 52"><circle cx="26" cy="26" r="23"/><path d="M15 27l8 8 14-16"/></svg><h1>Mantap!</h1><div class="muted">Workout ${TYPES[sess.type].name} tersimpan.</div>
    <div class="stat" style="margin:16px 0"><div><b>${fmtDur(sess.end - sess.start)}</b><span class="small muted">durasi</span></div>
    <div><b data-n="${sets.length}">0</b><span class="small muted">set</span></div><div><b data-n="${sets.reduce((n, s) => n + s.reps, 0)}">0</b><span class="small muted">repetisi</span></div></div>`;
  if (prs.length) h += `<h2>Rekor baru</h2>` + prs.map(p => `<div class="pr">${esc(p)}</div>`).join('');
  h += `<h2>Ringkasan</h2>` + sess.entries.map(e => `<div class="card row"><div class="grow">${esc(e.name)}</div><div class="muted">${fmtSets(e.sets)}</div></div>`).join('');
  h += `<button class="primary" style="width:100%;margin-top:12px" id="ok">Selesai</button>`;
  app.innerHTML = h;
  document.getElementById('ok').onclick = () => go('home');
}

function history() {
  let h = `<h1>Riwayat</h1><div class="muted">${S.sessions.length} sesi tercatat</div>`;
  if (!S.sessions.length) h += `<div class="card muted">Belum ada sesi. Riwayat muncul setelah kamu menekan "Selesai Workout".</div>`;
  [...S.sessions].reverse().forEach(s => {
    const T = TYPES[s.type], n = s.entries.reduce((k, e) => k + e.sets.length, 0);
    h += `<details><summary class="row"><span class="badge" style="--c:${T.color}">${T.name}</span><div class="grow">${fmtDate(s.start)}</div><div class="muted small">${n} set · ${fmtDur(s.end - s.start)}</div></summary>
      <div style="margin-top:10px">${s.entries.map(e => `<div class="row small" style="padding:4px 0"><div class="grow">${esc(e.name)}</div><div class="muted">${fmtSets(e.sets)}</div></div>`).join('')}
      ${s.note ? `<div class="cue small">${esc(s.note)}</div>` : ''}
      <button class="danger small" data-del="${s.id}">Hapus sesi ini</button></div></details>`;
  });
  app.innerHTML = h;
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!confirm('Hapus sesi ini dari riwayat? Tidak bisa dibatalkan.')) return;
    S.sessions = S.sessions.filter(s => s.id !== +b.dataset.del); save(); render();
  });
}

function progress() {
  const ids = [...new Set(S.sessions.flatMap(s => s.entries.map(e => e.ex)))];
  let h = `<h1>Progres</h1>`;
  if (!ids.length) { app.innerHTML = h + `<div class="card muted">Grafik progres muncul setelah kamu menyimpan minimal satu workout.</div>`; return; }
  if (!ids.includes(progEx)) progEx = ids[0];
  const data = S.sessions.map(s => ({ts: s.start, e: s.entries.find(e => e.ex === progEx)})).filter(d => d.e);
  const name = data[data.length - 1].e.name;
  const weighted = data.some(d => d.e.sets.some(s => s.kg > 0));
  const val = d => weighted ? Math.max(...d.e.sets.map(s => s.kg)) : d.e.sets.reduce((n, s) => n + s.reps, 0);
  const label = weighted ? 'Beban terberat (kg)' : 'Total repetisi';
  h += `<select id="pick">${ids.map(id => `<option value="${esc(id)}" ${id === progEx ? 'selected' : ''}>${esc(exName(id) === '(gerakan dihapus)' ? (S.sessions.flatMap(s => s.entries).find(e => e.ex === id) || {}).name : exName(id))}</option>`).join('')}</select>
    <h2>${esc(name)}</h2><div class="muted small">${label} per sesi</div>${chart(data.map(val), data.map(d => new Date(d.ts).toLocaleDateString('id-ID', {day: 'numeric', month: 'short'})))}
    <h2>Semua catatan</h2>` + [...data].reverse().map(d => `<div class="card row small"><div class="grow">${fmtDate(d.ts)}</div><div class="muted">${fmtSets(d.e.sets)}</div></div>`).join('');
  app.innerHTML = h;
  document.getElementById('pick').onchange = e => { progEx = e.target.value; render(); };
}
function chart(vals, labels) {
  const W = 340, H = 180, px = 30, py = 22, n = vals.length;
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const x = i => n === 1 ? W / 2 : px + i * (W - px * 2) / (n - 1), y = v => H - py - (v - lo) / span * (H - py * 2);
  const p = vals.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ');
  let s = `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7dd3fc" stop-opacity=".4"/><stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/></linearGradient></defs>${n > 1 ? `<polygon class="area" fill="url(#cg)" points="${x(0)},${H - py} ${p} ${x(n - 1)},${H - py}"/>` : ""}<polyline class="ln" pathLength="1" points="${p}"/>`;
  vals.forEach((v, i) => {
    s += `<circle class="dot" cx="${x(i)}" cy="${y(v)}" r="3.5"/>`;
    if (n <= 8 || i === 0 || i === n - 1 || v === hi) s += `<text x="${x(i)}" y="${y(v) - 8}" text-anchor="middle">${v}</text>`;
  });
  s += `<text x="${x(0)}" y="${H - 5}" text-anchor="middle">${labels[0]}</text>`;
  if (n > 1) s += `<text x="${x(n - 1)}" y="${H - 5}" text-anchor="middle">${labels[n - 1]}</text>`;
  return s + '</svg></div>';
}

function settings() {
  const list = S.plan[editType];
  const avail = [...Object.keys(EX), ...Object.keys(S.custom)].filter(id => !list.includes(id));
  app.innerHTML = `<h1>Pengaturan</h1>
    <h2>Timer istirahat</h2><div class="card row"><button id="rm">−15</button><div class="grow" style="text-align:center;font-size:22px;font-weight:700">${S.rest} detik</div><button id="rp">+15</button></div>
    <h2>Daftar gerakan</h2><div class="seg">${Object.keys(TYPES).map(k => `<button data-k="${k}" class="${k === editType ? 'on' : ''}">${TYPES[k].name}</button>`).join('')}</div>
    <div class="list-edit">${list.map((id, i) => `<div class="row"><div class="grow">${esc(exName(id))}</div>
      <button data-up="${i}" ${i ? '' : 'disabled'}>↑</button><button data-dn="${i}" ${i < list.length - 1 ? '' : 'disabled'}>↓</button><button class="danger" data-rm="${i}">✕</button></div>`).join('')}</div>
    ${avail.length ? `<div class="row" style="margin-top:8px"><select id="addSel" class="grow">${avail.map(id => `<option value="${esc(id)}">${esc(exName(id))}</option>`).join('')}</select><button id="add">Tambah</button></div>` : ''}
    <div class="row" style="margin-top:8px"><input type="text" id="newName" class="grow" placeholder="Gerakan baru (nama sendiri)" maxlength="40"><button id="addNew">Buat</button></div>
    <button class="ghost small" id="resetPlan">Kembalikan daftar ${TYPES[editType].name} ke bawaan</button>
    <h2>Backup data</h2><div class="muted small">Data hanya tersimpan di iPhone ini. Backup rutin, simpan filenya ke Files/iCloud.</div>
    <div class="row" style="margin-top:8px"><button class="grow" id="exp">Backup</button><button class="grow" id="imp">Restore</button></div>
    <input type="file" id="file" accept="application/json,.json" style="display:none">
    <h2>Reset</h2><div class="muted small">Hapus semua sesi, daftar gerakan buatan sendiri, dan pengaturan. App kembali seperti baru dipasang.</div>
    <button class="danger" style="width:100%;margin-top:8px" id="reset">Hapus semua data &amp; reset</button>
    <div class="muted small" style="margin-top:24px;text-align:center">PPL Log · ${S.sessions.length} sesi tersimpan · berjalan offline</div>`;
  const setRest = d => { S.rest = Math.min(300, Math.max(30, S.rest + d)); save(); render(); };
  document.getElementById('rm').onclick = () => setRest(-15);
  document.getElementById('rp').onclick = () => setRest(15);
  app.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { editType = b.dataset.k; render(); });
  const mv = (i, d) => { [list[i], list[i + d]] = [list[i + d], list[i]]; save(); render(); };
  app.querySelectorAll('[data-up]').forEach(b => b.onclick = () => mv(+b.dataset.up, -1));
  app.querySelectorAll('[data-dn]').forEach(b => b.onclick = () => mv(+b.dataset.dn, 1));
  app.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => {
    const i = +b.dataset.rm;
    if (!confirm(`Hapus "${exName(list[i])}" dari daftar ${TYPES[editType].name}? Riwayatnya tetap tersimpan.`)) return;
    list.splice(i, 1); save(); render();
  });
  const add = document.getElementById('add'); if (add) add.onclick = () => { list.push(document.getElementById('addSel').value); save(); render(); };
  document.getElementById('addNew').onclick = () => {
    const n = document.getElementById('newName').value.trim(); if (!n) return;
    const id = 'c_' + Date.now(); S.custom[id] = {name: n}; list.push(id); save(); render();
  };
  document.getElementById('resetPlan').onclick = () => {
    if (!confirm(`Kembalikan daftar ${TYPES[editType].name} ke bawaan?`)) return;
    S.plan[editType] = [...DEFAULT_PLAN[editType]]; save(); render();
  };
  document.getElementById('reset').onclick = () => {
    if (!confirm(`Hapus SEMUA data (${S.sessions.length} sesi, daftar gerakan, pengaturan)? Tidak bisa dibatalkan. Lakukan Backup dulu kalau masih perlu.`)) return;
    if (!confirm('Yakin? Ini terakhir kali ditanya.')) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = fresh(); lastResult = null; editType = 'push'; progEx = null; tickRest();
    toast('Data direset. App kembali ke kondisi awal.'); go('home');
  };
  document.getElementById('exp').onclick = backup;
  const file = document.getElementById('file');
  document.getElementById('imp').onclick = () => file.click();
  file.onchange = () => {
    const f = file.files[0]; if (!f) return;
    f.text().then(txt => {
      const d = JSON.parse(txt);
      if (!d || !Array.isArray(d.sessions) || !d.plan) throw new Error('format');
      if (!confirm(`Restore ${d.sessions.length} sesi dari backup? Data di iPhone ini sekarang akan diganti.`)) return;
      S = {...fresh(), ...d}; save(); toast('Data berhasil dipulihkan'); render();
    }).catch(() => alert('File ini bukan backup PPL Log yang valid.'));
    file.value = '';
  };
}
async function backup() {
  const name = 'ppllog-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const blob = new Blob([JSON.stringify(S)], {type: 'application/json'});
  const f = new File([blob], name, {type: 'application/json'});
  try {
    if (navigator.canShare && navigator.canShare({files: [f]})) { await navigator.share({files: [f], title: 'Backup PPL Log'}); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'update') document.body.classList.add('hasUpd'); });
  // The worker compares fresh files with its cached copy and messages us when they differ.
  const checkUpdate = () => { if (navigator.onLine) fetch('index.html').catch(() => {}); };
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
}
</script>
</body>
